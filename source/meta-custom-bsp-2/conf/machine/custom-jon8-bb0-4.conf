#@TYPE: Machine
#@NAME: custom-orin-nano
#@DESCRIPTION: Based on p3768-0000-p3767-0003 (Orin Nano 8GB)

# Inherit the based machine from meta-tegra
require conf/machine/p3768-0000-p3767-0003.conf
require conf/machine/include/custom-jon-bb0.inc

MACHINEOVERRIDES .= ":p3768-0000-p3767-0003"

# Common custom MB1 config for this carrier board
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-custom-jon-bb0-pinmux.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra234-custom-jon-bb0-padvoltage-default.dtsi"
